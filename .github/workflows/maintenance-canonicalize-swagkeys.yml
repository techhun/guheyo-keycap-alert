name: Maintenance - canonicalize SWAGKEYS

on:
  push:
    paths:
      - '.github/workflows/maintenance-canonicalize-swagkeys.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Canonicalize SWAGKEYS watcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-swagkeys-core.mjs')
          text = p.read_text()
          old_state = "const STATE_PATH = 'swg-state.json';"
          new_state = "const STATE_PATH = 'swagkeys-state.json';"
          old_secret = "const DISCORD_WEBHOOK_URL = (process.env.SWG_DISCORD_WEBHOOK_URL || '').trim();"
          new_secret = "const DISCORD_WEBHOOK_URL = (process.env.SWAGKEYS_DISCORD_WEBHOOK_URL || process.env.SWG_DISCORD_WEBHOOK_URL || '').trim();"
          if text.count(old_state) != 1 or text.count(old_secret) != 1:
              raise SystemExit('SWAGKEYS core canonicalization markers did not match exactly once')
          text = text.replace(old_state, new_state, 1).replace(old_secret, new_secret, 1)
          Path('scripts/check-swagkeys.mjs').write_text(text)
          p.unlink()
          PY
          git diff --check
          grep -q "STATE_PATH = 'swagkeys-state.json'" scripts/check-swagkeys.mjs
          grep -q 'SWAGKEYS_DISCORD_WEBHOOK_URL' scripts/check-swagkeys.mjs
          test ! -e scripts/check-swagkeys-core.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/check-swagkeys.mjs scripts/check-swagkeys-core.mjs
          git commit -m 'Canonicalize SWAGKEYS watcher'
          git pull --rebase origin main
          git push origin main
