name: Prototypist matrix test

on:
  push:
    paths:
      - '.github/workflows/prototypist-matrix-test.yml'
  workflow_dispatch:

jobs:
  scrape:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Keyboard
            url: 'https://prototypist.notion.site/57d8169dada041f6b52b1d091e3e2c97?v=449c85bd9a29455fa8d1330e23680c5a'
          - name: GMK
            url: 'https://prototypist.notion.site/dfedac384a2b494c9137be7638b11e93?v=11769ac8c9764aafb907fe3d65fb0c50'
          - name: Keyset
            url: 'https://prototypist.notion.site/119c46c4a89140e98b295ed0102eb94e?v=a13cd09931964dd596b125ea0013f5c6'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Read ${{ matrix.name }}
        env:
          SOURCE_NAME: ${{ matrix.name }}
          SOURCE_URL: ${{ matrix.url }}
        run: node tests/prototypist-single.mjs
