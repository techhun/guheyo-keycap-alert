name: Prototypist baseline

on:
  push:
    paths:
      - '.github/workflows/prototypist-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Build ProtoTypist baseline
        run: npm run check:prototypist
      - name: Commit baseline state
        shell: bash
        run: |
          if [ ! -f prototypist-state.json ]; then
            echo 'prototypist-state.json was not created.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypist-state.json
          if git diff --cached --quiet; then
            echo 'Baseline state unchanged.'
            exit 0
          fi
          git commit -m 'Initialize ProtoTypist watcher state'
          git pull --rebase origin main
          git push origin main
