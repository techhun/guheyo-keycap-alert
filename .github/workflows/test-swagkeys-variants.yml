name: Test SWAGKEYS product variants

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Inspect SWAGKEYS Shopify variants
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = 'https://swagkeys.com/products/in-stock-qwertykeys-neo65-core-plus-%EC%82%AC%EB%B3%B8';
          const response = await fetch(`${url}.js`, {
            headers: { 'User-Agent': 'Mozilla/5.0 keyboard-alert/1.0', 'Accept': 'application/json' }
          });
          console.log('HTTP', response.status, response.headers.get('content-type'));
          if (!response.ok) throw new Error(`product endpoint failed: ${response.status}`);
          const product = await response.json();
          console.log('TITLE:', product.title);
          console.log('OPTIONS:', JSON.stringify(product.options, null, 2));
          console.log('VARIANTS:', product.variants.length);
          console.log('AVAILABLE:', product.variants.filter(v => v.available).length);
          console.log('SAMPLE:', JSON.stringify(product.variants.slice(0, 8).map(v => ({
            id: v.id,
            title: v.title,
            option1: v.option1,
            option2: v.option2,
            option3: v.option3,
            available: v.available
          })), null, 2));
          JS

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/test-swagkeys-variants.yml
          git commit -m 'Remove SWAGKEYS variant test workflow'
          git push origin main
