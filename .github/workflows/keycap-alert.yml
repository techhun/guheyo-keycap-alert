name: Keycap alert

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/keycap-alert.yml'

permissions:
  contents: write

concurrency:
  group: guheyo-keycap-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Send one-off ntfy test
        if: github.event_name == 'push' && github.event.head_commit.message == 'Test ntfy notification'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo 'NTFY_TOPIC secret is empty or unavailable.'
            exit 1
          fi
          curl -fSs \
            -H 'Title: Keycap alert test' \
            -H 'Priority: high' \
            -H 'Tags: white_check_mark' \
            -d '구해요 키캡 알림 테스트입니다. 이 알림이 보이면 푸시 연결이 정상입니다.' \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo
          echo 'ntfy test request sent successfully.'

      - name: Check Guheyo keycap listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npm run check

      - name: Persist watcher state
        if: always()
        shell: bash
        run: |
          if [ ! -f state.json ]; then
            echo 'No state.json to persist.'
            exit 0
          fi

          if [ -z "$(git status --porcelain -- state.json)" ]; then
            echo 'State unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git commit -m 'Update keycap watcher state'
          git pull --rebase origin main
          git push origin main
