name: Keycap alert

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/keycap-alert.yml'

permissions:
  contents: write

concurrency:
  group: guheyo-keycap-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Guheyo keycap listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check

      - name: Persist watcher state
        if: always()
        shell: bash
        run: |
          if [ ! -f state.json ]; then
            echo 'No state.json to persist.'
            exit 0
          fi

          if [ -z "$(git status --porcelain -- state.json)" ]; then
            echo 'State unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git commit -m 'Update keycap watcher state'
          git pull --rebase origin main
          git push origin main
