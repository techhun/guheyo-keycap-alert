name: Keyboard alerts (fast)

# Legacy filename retained so the existing cron-job.org endpoint keeps working.
# After cron is moved to keyboard-alert-fast.yml, this compatibility workflow can be removed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keyboard-alerts-fast
  cancel-in-progress: false

jobs:
  monitor-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Guheyo keycap listings
        env:
          GUHEYO_NTFY_TOPIC: ${{ secrets.GUHEYO_NTFY_TOPIC }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GUHEYO_DISCORD_WEBHOOK_URL: ${{ secrets.GUHEYO_DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check:guheyo

      - name: Check DCInside tteotnya posts
        if: always()
        env:
          DCINSIDE_DISCORD_WEBHOOK_URL: ${{ secrets.DCINSIDE_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if npm run check:dcinside; then
            exit 0
          fi

          echo 'DCInside read failed once; retrying...'
          if npm run check:dcinside; then
            exit 0
          fi

          echo 'DCInside is temporarily unavailable after retries. Keeping the previous verified state and continuing.'

      - name: Persist fast watcher state
        if: always()
        shell: bash
        run: |
          changed_files=()

          for file in guheyo-state.json dcinside-tteotnya-state.json; do
            if [ -f "$file" ] && [ -n "$(git status --porcelain -- "$file")" ]; then
              changed_files+=("$file")
            fi
          done

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo 'Fast watcher state unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${changed_files[@]}"
          git commit -m 'Update fast watcher state'

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            echo "Fast state push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done

          echo 'Failed to persist fast watcher state after retries.'
          exit 1
