name: Keyboard alerts

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/keycap-alert.yml'

permissions:
  contents: write

concurrency:
  group: keyboard-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Send SWAGKEYS test notification
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[test-swg-alert]')
        env:
          SWG_DISCORD_WEBHOOK_URL: ${{ secrets.SWG_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          node <<'NODE'
          const url = process.env.SWG_DISCORD_WEBHOOK_URL;
          if (!url) throw new Error('SWG_DISCORD_WEBHOOK_URL is not configured');

          const payload = {
            embeds: [{
              title: '[TEST] SWAGKEYS 분기별 로드맵 업데이트',
              description: '알림 표시 형식 테스트입니다. 실제 SWAGKEYS 데이터는 변경하지 않습니다.',
              fields: [
                { name: '분기 이동', value: 'SWG Test Move: Q3 → Q4', inline: false },
                { name: '신규 배치', value: 'SWG Test New → Q4', inline: false },
                { name: '로드맵 제외', value: 'SWG Test Removed (Q3)', inline: false }
              ],
              footer: { text: '알림 테스트 · 실제 데이터 변경 아님' },
              timestamp: new Date().toISOString()
            }]
          };

          const response = await fetch(url, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
          console.log('SWAGKEYS test notification sent successfully.');
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Guheyo keycap listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check

      - name: Check GEONWORKS GB schedule
        if: always()
        env:
          GEONWORKS_DISCORD_WEBHOOK_URL: ${{ secrets.GEONWORKS_DISCORD_WEBHOOK_URL }}
        run: npm run check:geonworks

      - name: Check GEONWORKS Release schedule
        if: always()
        env:
          GEONWORKS_DISCORD_WEBHOOK_URL: ${{ secrets.GEONWORKS_DISCORD_WEBHOOK_URL }}
        run: npm run check:geonworks-release

      - name: Check ProtoTypist updates
        if: always()
        env:
          PROTOTYPIST_DISCORD_WEBHOOK_URL: ${{ secrets.PROTOTYPIST_DISCORD_WEBHOOK_URL }}
        run: npm run check:prototypist || (echo 'ProtoTypist read failed once; retrying...' && npm run check:prototypist)

      - name: Check SWAGKEYS roadmap
        if: always()
        env:
          SWG_DISCORD_WEBHOOK_URL: ${{ secrets.SWG_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if npm run check:swg; then
            exit 0
          fi

          echo 'SWAGKEYS read failed once; retrying...'
          if npm run check:swg; then
            exit 0
          fi

          echo 'SWAGKEYS is temporarily unavailable after retries. Keeping the previous verified state and continuing.'

      - name: Persist watcher state
        if: always()
        shell: bash
        run: |
          changed_files=()

          for file in state.json geonworks-state.json geonworks-release-state.json prototypist-state.json swg-state.json; do
            if [ -f "$file" ] && [ -n "$(git status --porcelain -- "$file")" ]; then
              changed_files+=("$file")
            fi
          done

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo 'Watcher state unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${changed_files[@]}"
          git commit -m 'Update watcher state'
          git pull --rebase origin main
          git push origin main
