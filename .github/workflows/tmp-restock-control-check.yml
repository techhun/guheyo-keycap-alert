name: Temporary Restock Control Check

on:
  push:
    paths:
      - 'scripts/restock-bot.mjs'
      - 'scripts/restock/control.mjs'
      - 'scripts/register-restock-commands.mjs'
      - '.github/workflows/tmp-restock-control-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check scripts/restock/control.mjs
          node --check scripts/register-restock-commands.mjs
          node --check scripts/restock-bot.mjs
      - name: Control model smoke test
        run: |
          node --input-type=module - <<'NODE'
          import { parseKstDateTime, formatKstDateTime, monitoringStatus } from './scripts/restock/control.mjs';
          const startAt = parseKstDateTime('2026-09-20 19:50');
          const endAt = parseKstDateTime('2026-09-20 22:00');
          if (formatKstDateTime(startAt) !== '2026-09-20 19:50') throw new Error('KST formatting mismatch');
          if (!monitoringStatus({ mode: 'scheduled', schedule: { startAt, endAt } }, Date.parse('2026-09-20T11:00:00Z')).active) throw new Error('schedule should be active');
          if (monitoringStatus({ mode: 'scheduled', schedule: { startAt, endAt } }, Date.parse('2026-09-20T13:30:00Z')).active) throw new Error('schedule should be inactive');
          console.log('restock control smoke test OK');
          NODE
