name: GEONWORKS diagnostic

on:
  push:
    paths:
      - '.github/workflows/geonworks-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Inspect GEONWORKS GB schedule
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const url = 'https://geonworks.kr/customhtml/GB_schedule.html';
          const browser = await chromium.launch({ headless: true, channel: 'chrome' });
          try {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 2000 },
              locale: 'ko-KR',
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
            });

            const responses = [];
            page.on('response', response => {
              const u = response.url();
              if (/google|sheet|csv|json|api|script|schedule/i.test(u)) {
                responses.push(`${response.status()} ${response.request().resourceType()} ${u}`);
              }
            });

            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForLoadState('networkidle', { timeout: 10000 }).catch(() => {});
            await page.waitForTimeout(3000);

            console.log('TITLE', await page.title());
            console.log('URL', page.url());
            console.log('NETWORK_CANDIDATES');
            for (const row of [...new Set(responses)].slice(0, 100)) console.log(row);

            const info = await page.evaluate(() => {
              const clean = s => String(s || '').replace(/\s+/g, ' ').trim();
              const tables = [...document.querySelectorAll('table')].map((table, ti) => ({
                ti,
                className: table.className,
                rows: [...table.querySelectorAll('tr')].map((tr, ri) => ({
                  ri,
                  text: clean(tr.innerText),
                  cells: [...tr.querySelectorAll('th,td')].map(td => clean(td.innerText))
                })).filter(x => x.text)
              })).filter(x => x.rows.length);

              const rowish = [...document.querySelectorAll('tr, [role="row"], .row, [class*="row"], li')]
                .map((el, i) => ({ i, tag: el.tagName, cls: el.className, text: clean(el.innerText) }))
                .filter(x => x.text && /GB|ETA|PRODUCTION|INSPECT|ON SALE|SHOWING|IN PROGRESS|keyboard|키보드/i.test(x.text))
                .slice(0, 100);

              return {
                tables,
                rowish,
                body: (document.body?.innerText || '').slice(0, 20000),
                htmlMarkers: [...document.querySelectorAll('[id], [class]')]
                  .map(el => `${el.tagName}#${el.id}.${String(el.className || '').replace(/\s+/g, '.')}`)
                  .filter(x => /schedule|gb|table|list|grid|row|item/i.test(x))
                  .slice(0, 200)
              };
            });

            console.log('TABLES', JSON.stringify(info.tables, null, 2));
            console.log('ROWISH', JSON.stringify(info.rowish, null, 2));
            console.log('MARKERS', JSON.stringify(info.htmlMarkers, null, 2));
            console.log('BODY_START\n' + info.body + '\nBODY_END');
          } finally {
            await browser.close();
          }
          NODE
