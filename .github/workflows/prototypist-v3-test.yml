name: Prototypist v3 test

on:
  push:
    paths:
      - '.github/workflows/prototypist-v3-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Run ProtoTypist watcher without Discord
        run: node scripts/check-prototypist-v3.mjs
