name: Prototypist structure test

on:
  push:
    paths:
      - '.github/workflows/prototypist-structure-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node tests/prototypist-structure.mjs
