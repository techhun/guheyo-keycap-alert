name: Apply notification format fix

on:
  push:
    paths:
      - '.github/workflows/apply-message-format-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply line-break fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          multiline_old = """function truncate(value, maxLength = 1000) {\n  const text = clean(value) || '—';\n  if (text.length <= maxLength) return text;\n  return `${text.slice(0, Math.max(0, maxLength - 1)).trimEnd()}…`;\n}"""
          multiline_new = """function truncate(value, maxLength = 1000) {\n  const text = String(value ?? '')\n    .replace(/\\r/g, '')\n    .split('\\n')\n    .map(clean)\n    .filter(Boolean)\n    .join('\\n') || '—';\n  if (text.length <= maxLength) return text;\n  return `${text.slice(0, Math.max(0, maxLength - 1)).trimEnd()}…`;\n}"""

          for path in [
              'scripts/check-geonworks.mjs',
              'scripts/check-geonworks-release.mjs',
          ]:
              replace_once(path, multiline_old, multiline_new)

          proto_old = """const truncate = (value, maxLength = 1000) => {\n  const text = clean(value) || '—';\n  return text.length <= maxLength ? text : `${text.slice(0, maxLength - 1).trimEnd()}…`;\n};"""
          proto_new = """const truncate = (value, maxLength = 1000) => {\n  const text = String(value ?? '')\n    .replace(/\\r/g, '')\n    .split('\\n')\n    .map(clean)\n    .filter(Boolean)\n    .join('\\n') || '—';\n  return text.length <= maxLength ? text : `${text.slice(0, maxLength - 1).trimEnd()}…`;\n};"""
          replace_once('scripts/check-prototypist-v3.mjs', proto_old, proto_new)

          for path in ['scripts/check-prototypist-v3.mjs', 'scripts/check-swg.mjs']:
              p = Path(path)
              text = p.read_text()
              old = "\\\n현재:"
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 line-continuation match, found {count}')
              p.write_text(text.replace(old, "\\n현재:", 1))
          PY

          node --check scripts/check-geonworks.mjs
          node --check scripts/check-geonworks-release.mjs
          node --check scripts/check-prototypist-v3.mjs
          node --check scripts/check-swg.mjs

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-geonworks.mjs scripts/check-geonworks-release.mjs scripts/check-prototypist-v3.mjs scripts/check-swg.mjs
          git commit -m 'Improve previous/current notification readability'
          git push origin main
