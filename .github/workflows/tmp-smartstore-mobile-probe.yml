name: Temporary SmartStore Mobile Probe

on:
  push:
    paths:
      - '.github/workflows/tmp-smartstore-mobile-probe.yml'
      - '.tmp-smartstore-mobile-trigger'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probe mobile SmartStore URL
        run: xvfb-run -a npm run restock:probe -- "https://m.smartstore.naver.com/swagkey/products/12348949592"
