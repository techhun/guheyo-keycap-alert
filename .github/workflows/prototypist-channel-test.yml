name: ProtoTypist channel test

on:
  push:
    paths:
      - '.github/workflows/prototypist-channel-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send ProtoTypist test
        env:
          WEBHOOK: ${{ secrets.PROTOTYPIST_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          node <<'NODE'
          const webhook = (process.env.WEBHOOK || '').trim();
          if (!webhook) throw new Error('PROTOTYPIST_DISCORD_WEBHOOK_URL is empty');
          const payload = {
            username: 'Proto[Typist] Updates',
            allowed_mentions: { parse: [] },
            embeds: [{
              title: '🧪 ⌨️ Proto[Typist] 알림 테스트 · Supernova 60%',
              url: 'https://prototypist.notion.site/57d8169dada041f6b52b1d091e3e2c97?v=449c85bd9a29455fa8d1330e23680c5a',
              description: 'Discord 웹훅 연결 확인용 테스트 메시지입니다.',
              fields: [
                { name: '상태', value: 'In Group Buy', inline: true },
                { name: '예상 고객 배송', value: 'Q1 2027', inline: true }
              ],
              footer: { text: 'Proto[Typist] · Keyboard Updates · 테스트' },
              timestamp: new Date().toISOString()
            }]
          };
          const res = await fetch(webhook + (webhook.includes('?') ? '&wait=true' : '?wait=true'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const text = await res.text();
          if (!res.ok) throw new Error(`Discord webhook failed: ${res.status} ${text}`);
          console.log('ProtoTypist Discord test sent successfully.');
          NODE
