name: Maintenance - confirm removals

on:
  push:
    paths:
      - '.github/workflows/maintenance-confirm-removals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch removal confirmation guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # GEONWORKS GB
          path = 'scripts/check-geonworks.mjs'
          old = """const rows = await fetchRows();
          console.log(`GEONWORKS GB rows: ${rows.length}`);
          console.log('GEONWORKS sample:', JSON.stringify(rows[0], null, 2));

          const state = loadState();
          const previousRows = Array.isArray(state?.rows) ? state.rows : [];

          if (!state?.initialized || previousRows.length === 0) {
            console.log(`Baseline initialization: storing ${rows.length} GEONWORKS rows without notifying.`);
            saveState(rows);
            process.exit(0);
          }

          if (rows.length < Math.max(5, Math.floor(previousRows.length * 0.5))) {
            throw new Error(`GEONWORKS row count dropped unexpectedly: ${previousRows.length} -> ${rows.length}. State was not updated.`);
          }

          const changes = diffRows(previousRows, rows);
          console.log(`GEONWORKS changes: ${changes.length}`);
          """
          new = """let rows = await fetchRows();
          console.log(`GEONWORKS GB rows: ${rows.length}`);
          console.log('GEONWORKS sample:', JSON.stringify(rows[0], null, 2));

          const state = loadState();
          const previousRows = Array.isArray(state?.rows) ? state.rows : [];

          if (!state?.initialized || previousRows.length === 0) {
            console.log(`Baseline initialization: storing ${rows.length} GEONWORKS rows without notifying.`);
            saveState(rows);
            process.exit(0);
          }

          const validateRows = (candidateRows) => {
            if (candidateRows.length < Math.max(5, Math.floor(previousRows.length * 0.5))) {
              throw new Error(`GEONWORKS row count dropped unexpectedly: ${previousRows.length} -> ${candidateRows.length}. State was not updated.`);
            }
          };
          const removalSignature = (candidateChanges) => candidateChanges
            .filter((change) => change.kind === 'removed')
            .map((change) => JSON.stringify(change.row))
            .sort()
            .join('\\n');

          validateRows(rows);
          let changes = diffRows(previousRows, rows);
          const firstRemovalSignature = removalSignature(changes);
          if (firstRemovalSignature) {
            console.warn('GEONWORKS removal detected; re-reading once before notifying.');
            const verificationRows = await fetchRows();
            validateRows(verificationRows);
            const verificationChanges = diffRows(previousRows, verificationRows);
            const secondRemovalSignature = removalSignature(verificationChanges);
            if (secondRemovalSignature && secondRemovalSignature !== firstRemovalSignature) {
              throw new Error('GEONWORKS removal set changed during verification. State was not updated.');
            }
            rows = verificationRows;
            changes = verificationChanges;
            console.log(secondRemovalSignature
              ? 'GEONWORKS removal confirmed by two consecutive reads.'
              : 'GEONWORKS removal disappeared on verification; using the verified second snapshot.');
          }

          console.log(`GEONWORKS changes: ${changes.length}`);
          """
          replace_once(path, old, new)

          # GEONWORKS Release
          path = 'scripts/check-geonworks-release.mjs'
          old = """const rows = await fetchRows();
          console.log(`GEONWORKS Release rows: ${rows.length}`);
          console.log('GEONWORKS Release sample:', JSON.stringify(rows[0], null, 2));

          const state = loadState();
          const previousRows = Array.isArray(state?.rows) ? state.rows : [];

          if (!state?.initialized || previousRows.length === 0) {
            console.log(`Baseline initialization: storing ${rows.length} GEONWORKS Release rows without notifying.`);
            saveState(rows);
            process.exit(0);
          }

          if (rows.length < Math.max(1, Math.floor(previousRows.length * 0.5))) {
            throw new Error(`GEONWORKS Release row count dropped unexpectedly: ${previousRows.length} -> ${rows.length}. State was not updated.`);
          }

          const changes = diffRows(previousRows, rows);
          console.log(`GEONWORKS Release changes: ${changes.length}`);
          """
          new = """let rows = await fetchRows();
          console.log(`GEONWORKS Release rows: ${rows.length}`);
          console.log('GEONWORKS Release sample:', JSON.stringify(rows[0], null, 2));

          const state = loadState();
          const previousRows = Array.isArray(state?.rows) ? state.rows : [];

          if (!state?.initialized || previousRows.length === 0) {
            console.log(`Baseline initialization: storing ${rows.length} GEONWORKS Release rows without notifying.`);
            saveState(rows);
            process.exit(0);
          }

          const validateRows = (candidateRows) => {
            if (candidateRows.length < Math.max(1, Math.floor(previousRows.length * 0.5))) {
              throw new Error(`GEONWORKS Release row count dropped unexpectedly: ${previousRows.length} -> ${candidateRows.length}. State was not updated.`);
            }
          };
          const removalSignature = (candidateChanges) => candidateChanges
            .filter((change) => change.kind === 'removed')
            .map((change) => JSON.stringify(change.row))
            .sort()
            .join('\\n');

          validateRows(rows);
          let changes = diffRows(previousRows, rows);
          const firstRemovalSignature = removalSignature(changes);
          if (firstRemovalSignature) {
            console.warn('GEONWORKS Release removal detected; re-reading once before notifying.');
            const verificationRows = await fetchRows();
            validateRows(verificationRows);
            const verificationChanges = diffRows(previousRows, verificationRows);
            const secondRemovalSignature = removalSignature(verificationChanges);
            if (secondRemovalSignature && secondRemovalSignature !== firstRemovalSignature) {
              throw new Error('GEONWORKS Release removal set changed during verification. State was not updated.');
            }
            rows = verificationRows;
            changes = verificationChanges;
            console.log(secondRemovalSignature
              ? 'GEONWORKS Release removal confirmed by two consecutive reads.'
              : 'GEONWORKS Release removal disappeared on verification; using the verified second snapshot.');
          }

          console.log(`GEONWORKS Release changes: ${changes.length}`);
          """
          replace_once(path, old, new)

          # ProtoTypist
          path = 'scripts/check-prototypist.mjs'
          old = """async function main() {
          const rows = await fetchRows();
          console.log(`Proto[Typist] total rows: ${rows.length}`);
          console.log('Proto[Typist] counts:', JSON.stringify(sourceCounts(rows)));

          const state = loadState();
          const previousRows = Array.isArray(state?.rows) ? state.rows : [];

          if (!state?.initialized || previousRows.length === 0) {
            console.log(`Baseline initialization: storing ${rows.length} Proto[Typist] rows without notifying.`);
            saveState(rows);
            process.exit(0);
          }

          const previousCounts = sourceCounts(previousRows);
          const currentCounts = sourceCounts(rows);
          for (const source of SOURCES) {
            const before = previousCounts[source.id] || 0;
            const after = currentCounts[source.id] || 0;
            if (before > 0 && after < Math.max(1, Math.floor(before * 0.5))) {
              throw new Error(`Proto[Typist] ${source.label} row count dropped unexpectedly: ${before} -> ${after}. State was not updated.`);
            }
          }

          const changes = diffRows(previousRows, rows);
          console.log(`Proto[Typist] changes: ${changes.length}`);
          """
          new = """async function main() {
          let rows = await fetchRows();
          console.log(`Proto[Typist] total rows: ${rows.length}`);
          console.log('Proto[Typist] counts:', JSON.stringify(sourceCounts(rows)));

          const state = loadState();
          const previousRows = Array.isArray(state?.rows) ? state.rows : [];

          if (!state?.initialized || previousRows.length === 0) {
            console.log(`Baseline initialization: storing ${rows.length} Proto[Typist] rows without notifying.`);
            saveState(rows);
            process.exit(0);
          }

          const validateSourceCounts = (candidateRows) => {
            const previousCounts = sourceCounts(previousRows);
            const currentCounts = sourceCounts(candidateRows);
            for (const source of SOURCES) {
              const before = previousCounts[source.id] || 0;
              const after = currentCounts[source.id] || 0;
              if (before > 0 && after < Math.max(1, Math.floor(before * 0.5))) {
                throw new Error(`Proto[Typist] ${source.label} row count dropped unexpectedly: ${before} -> ${after}. State was not updated.`);
              }
            }
          };
          const removalSignature = (candidateChanges) => candidateChanges
            .filter((change) => change.kind === 'removed')
            .map((change) => `${change.row.sourceId}|${normalizeUrl(change.row.itemUrl)}|${clean(change.row.product)}`)
            .sort()
            .join('\\n');

          validateSourceCounts(rows);
          let changes = diffRows(previousRows, rows);
          const firstRemovalSignature = removalSignature(changes);
          if (firstRemovalSignature) {
            console.warn('Proto[Typist] removal detected; re-reading once before notifying.');
            const verificationRows = await fetchRows();
            validateSourceCounts(verificationRows);
            const verificationChanges = diffRows(previousRows, verificationRows);
            const secondRemovalSignature = removalSignature(verificationChanges);
            if (secondRemovalSignature && secondRemovalSignature !== firstRemovalSignature) {
              throw new Error('Proto[Typist] removal set changed during verification. State was not updated.');
            }
            rows = verificationRows;
            changes = verificationChanges;
            console.log(secondRemovalSignature
              ? 'Proto[Typist] removal confirmed by two consecutive reads.'
              : 'Proto[Typist] removal disappeared on verification; using the verified second snapshot.');
          }

          console.log(`Proto[Typist] changes: ${changes.length}`);
          """
          replace_once(path, old, new)

          # SWAGKEYS core
          path = 'scripts/check-swagkeys-core.mjs'
          old = """  const state = loadState();
            const previousRows = Array.isArray(state?.rows) ? state.rows : [];
            const snapshot = await fetchSnapshot(previousRows);
            console.log(`SWAGKEYS announcement: ${snapshot.announcement.heading}`);
            console.log(`SWAGKEYS status rows: ${snapshot.rows.length}${snapshot.statusFresh ? '' : ' (stored fallback)'}`);

            if (!state?.initialized || previousRows.length === 0) {
              console.log(`Baseline initialization: storing ${snapshot.rows.length} SWAGKEYS rows without notifying.`);
              saveState(snapshot);
              return;
            }

            if (!quarterSnapshotIsValid(state.quarters)) {
              console.warn('Stored SWAGKEYS quarter roadmap was incomplete or polluted by Notion error placeholders. Replacing it with a verified snapshot without notifying.');
              saveState(snapshot);
              return;
            }

            if (snapshot.rows.length < Math.max(8, Math.floor(previousRows.length * 0.5))) {
              throw new Error(`SWAGKEYS row count dropped unexpectedly: ${previousRows.length} -> ${snapshot.rows.length}. State was not updated.`);
            }

            const announcementChanged = clean(state.announcement?.heading) !== clean(snapshot.announcement.heading)
              || clean(state.announcement?.content) !== clean(snapshot.announcement.content);
            const quarterChanges = diffQuarters(state.quarters, snapshot.quarters);
            const quartersChanged = hasQuarterChanges(quarterChanges);
            const changes = diffRows(previousRows, snapshot.rows);
            console.log(`SWAGKEYS announcement changed: ${announcementChanged}`);
            console.log(`SWAGKEYS quarter roadmap changed: ${quartersChanged}`);
            console.log(`SWAGKEYS product changes: ${changes.length}`);
          """
          new = """  const state = loadState();
            const previousRows = Array.isArray(state?.rows) ? state.rows : [];
            let snapshot = await fetchSnapshot(previousRows);
            console.log(`SWAGKEYS announcement: ${snapshot.announcement.heading}`);
            console.log(`SWAGKEYS status rows: ${snapshot.rows.length}${snapshot.statusFresh ? '' : ' (stored fallback)'}`);

            if (!state?.initialized || previousRows.length === 0) {
              console.log(`Baseline initialization: storing ${snapshot.rows.length} SWAGKEYS rows without notifying.`);
              saveState(snapshot);
              return;
            }

            if (!quarterSnapshotIsValid(state.quarters)) {
              console.warn('Stored SWAGKEYS quarter roadmap was incomplete or polluted by Notion error placeholders. Replacing it with a verified snapshot without notifying.');
              saveState(snapshot);
              return;
            }

            const validateRows = (candidateSnapshot) => {
              if (candidateSnapshot.rows.length < Math.max(8, Math.floor(previousRows.length * 0.5))) {
                throw new Error(`SWAGKEYS row count dropped unexpectedly: ${previousRows.length} -> ${candidateSnapshot.rows.length}. State was not updated.`);
              }
            };
            const removalSignature = (candidateQuarterChanges, candidateChanges) => [
              ...candidateQuarterChanges.removed.map((item) => `roadmap|${clean(item.product).toLowerCase()}|${item.quarter}`),
              ...candidateChanges
                .filter((change) => change.kind === 'removed')
                .map((change) => `status|${clean(change.row.product).toLowerCase()}`)
            ].sort().join('\\n');
            const calculateChanges = (candidateSnapshot) => {
              const announcementChanged = clean(state.announcement?.heading) !== clean(candidateSnapshot.announcement.heading)
                || clean(state.announcement?.content) !== clean(candidateSnapshot.announcement.content);
              const quarterChanges = diffQuarters(state.quarters, candidateSnapshot.quarters);
              const changes = diffRows(previousRows, candidateSnapshot.rows);
              return { announcementChanged, quarterChanges, quartersChanged: hasQuarterChanges(quarterChanges), changes };
            };

            validateRows(snapshot);
            let calculated = calculateChanges(snapshot);
            const firstRemovalSignature = removalSignature(calculated.quarterChanges, calculated.changes);
            if (firstRemovalSignature) {
              console.warn('SWAGKEYS removal detected; re-reading once before notifying.');
              const verificationSnapshot = await fetchSnapshot(previousRows);
              validateRows(verificationSnapshot);
              const verificationCalculated = calculateChanges(verificationSnapshot);
              const secondRemovalSignature = removalSignature(verificationCalculated.quarterChanges, verificationCalculated.changes);
              if (secondRemovalSignature && secondRemovalSignature !== firstRemovalSignature) {
                throw new Error('SWAGKEYS removal set changed during verification. State was not updated.');
              }
              snapshot = verificationSnapshot;
              calculated = verificationCalculated;
              console.log(secondRemovalSignature
                ? 'SWAGKEYS removal confirmed by two consecutive reads.'
                : 'SWAGKEYS removal disappeared on verification; using the verified second snapshot.');
            }

            let { announcementChanged, quarterChanges, quartersChanged, changes } = calculated;
            console.log(`SWAGKEYS announcement changed: ${announcementChanged}`);
            console.log(`SWAGKEYS quarter roadmap changed: ${quartersChanged}`);
            console.log(`SWAGKEYS product changes: ${changes.length}`);
          """
          replace_once(path, old, new)

          p = Path(path)
          text = p.read_text()
          text = text.replace(
              "[discord] SWG_DISCORD_WEBHOOK_URL is not configured. Changes remain pending; state was not updated.",
              "[discord] SWAGKEYS_DISCORD_WEBHOOK_URL/SWG_DISCORD_WEBHOOK_URL is not configured. Changes remain pending; state was not updated."
          )
          p.write_text(text)
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'removal confirmed by two consecutive reads' scripts/check-geonworks.mjs
          grep -q 'removal confirmed by two consecutive reads' scripts/check-geonworks-release.mjs
          grep -q 'removal confirmed by two consecutive reads' scripts/check-prototypist.mjs
          grep -q 'removal confirmed by two consecutive reads' scripts/check-swagkeys-core.mjs

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-geonworks.mjs scripts/check-geonworks-release.mjs scripts/check-prototypist.mjs scripts/check-swagkeys-core.mjs
          git commit -m 'Confirm removals before notifying'
          git pull --rebase origin main
          git push origin main
