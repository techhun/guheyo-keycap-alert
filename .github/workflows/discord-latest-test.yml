name: Discord latest listing test

on:
  push:
    paths:
      - '.github/workflows/discord-latest-test.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Send latest listing to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const webhook = (process.env.DISCORD_WEBHOOK_URL || '').trim();
          if (!webhook) throw new Error('DISCORD_WEBHOOK_URL is missing');

          const browser = await chromium.launch({ headless: true, channel: 'chrome' });
          try {
            const page = await browser.newPage({ locale: 'ko-KR' });
            await page.goto('https://guheyo.com/g/keyboard/sell?category=keycap', { waitUntil: 'domcontentloaded', timeout: 60000 });
            const links = page.locator('a[href*="/offer/"]');
            await links.first().waitFor({ state: 'attached', timeout: 20000 });
            await page.waitForTimeout(1500);

            const rows = await links.evaluateAll(nodes => nodes.map(a => ({
              href: a.href,
              text: (a.innerText || a.textContent || '').replace(/\s+/g, ' ').trim()
            })));
            const latest = rows.find(x => /키캡/.test(x.text) && /[\d,]+\s*원/.test(x.text));
            if (!latest) throw new Error('No keycap listing found');

            const normalized = latest.text;
            const price = normalized.match(/([\d,]+\s*원)\s*$/)?.[1] || '';
            let title = normalized
              .replace(/^(?:방금 전|하루 전|한 시간 전|\d+\s*(?:초|분|시간|일)\s*전)\s+/, '')
              .replace(/\s+키캡\s+[\d,]+\s*원\s*$/, '')
              .trim() || '새 키캡 매물';

            const detailPage = await browser.newPage({ locale: 'ko-KR' });
            await detailPage.goto(latest.href, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await detailPage.waitForTimeout(1200);
            let detail = await detailPage.evaluate(() => {
              for (const script of document.querySelectorAll('script[type="application/ld+json"]')) {
                try {
                  const parsed = JSON.parse(script.textContent || 'null');
                  for (const node of (Array.isArray(parsed) ? parsed : [parsed])) {
                    if (node && node['@type'] === 'Product' && typeof node.description === 'string') return node.description;
                  }
                } catch {}
              }
              return document.querySelector('meta[property="og:description"], meta[name="description"]')?.getAttribute('content') || '';
            });
            detail = String(detail || '').replace(/\r/g, '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
            if (!detail) detail = '판매글 본문이 없습니다.';

            const chunks = [];
            let remaining = detail;
            const max = 3600;
            while (remaining.length > max) {
              let cut = remaining.lastIndexOf('\n', max);
              if (cut < Math.floor(max * 0.6)) cut = remaining.lastIndexOf(' ', max);
              if (cut < Math.floor(max * 0.6)) cut = max;
              chunks.push(remaining.slice(0, cut).trimEnd());
              remaining = remaining.slice(cut).trimStart();
            }
            if (remaining) chunks.push(remaining);

            for (let i = 0; i < chunks.length; i++) {
              const first = i === 0;
              const embed = {
                title: first ? `🆕 ${title.slice(0, 250)}` : `↳ 본문 계속 (${i + 1}/${chunks.length})`,
                url: latest.href,
                description: `**판매글 내용**\n${chunks[i]}`,
                footer: { text: first ? '구해요 · 키캡 판매 알림' : `구해요 · 본문 ${i + 1}/${chunks.length}` },
                timestamp: new Date().toISOString()
              };
              if (first && price) embed.fields = [{ name: '💰 가격', value: `**${price}**`, inline: true }];

              const response = await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: 'Guheyo Keycap Alert', allowed_mentions: { parse: [] }, embeds: [embed] })
              });
              if (!response.ok) throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
            }

            console.log('Sent latest listing:', title, price, latest.href);
          } finally {
            await browser.close();
          }
          NODE
