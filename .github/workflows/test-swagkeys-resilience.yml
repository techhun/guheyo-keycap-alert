name: Test SWAGKEYS collection resilience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      - name: Test SWAGKEYS collector
        id: collector
        continue-on-error: true
        env:
          SWAGKEYS_DISCORD_WEBHOOK_URL: ''
          SWG_DISCORD_WEBHOOK_URL: ''
        run: npm run check:swagkeys

      - name: Remove temporary test workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/test-swagkeys-resilience.yml
          git commit -m 'Remove SWAGKEYS test workflow'
          git push origin main

      - name: Propagate collector result
        if: steps.collector.outcome != 'success'
        run: exit 1
