name: Temporary SWAGKEYS notification preview

on:
  push:
    paths:
      - '.github/workflows/temp-swg-notification-preview.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Send announcement, added, changed, and removed previews
        env:
          SWG_DISCORD_WEBHOOK_URL: ${{ secrets.SWG_DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            announcementEmbed,
            addedEmbed,
            changedEmbed,
            removedEmbed
          } from './scripts/check-swg.mjs';

          const webhook = (process.env.SWG_DISCORD_WEBHOOK_URL || '').trim();
          if (!webhook) throw new Error('SWG_DISCORD_WEBHOOK_URL is empty');
          const state = JSON.parse(fs.readFileSync('swg-state.json', 'utf8'));
          const [added, changed, removed] = state.rows;
          if (!added || !changed || !removed) throw new Error('SWAGKEYS baseline rows are missing');

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const send = async (embed) => {
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const url = webhook + (webhook.includes('?') ? '&wait=true' : '?wait=true');
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  username: 'SWAGKEYS Updates',
                  allowed_mentions: { parse: [] },
                  embeds: [embed]
                })
              });
              if (response.ok) return;
              if (response.status === 429 && attempt < 3) {
                const body = await response.json().catch(() => ({}));
                await sleep(Math.ceil((Number(body.retry_after) || 1) * 1000));
                continue;
              }
              throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
            }
          };

          await send(announcementEmbed(state.announcement));
          await sleep(750);
          await send(addedEmbed(added));
          await sleep(750);
          await send(changedEmbed({
            row: changed,
            fields: [
              { label: '배송중 진행률', type: 'percent', before: 0, after: changed.shipping },
              { label: '현재 상태', before: '생산중 (In Production)', after: changed.currentStatus }
            ]
          }));
          await sleep(750);
          await send(removedEmbed(removed));
          console.log(`Sent SWAGKEYS previews: announcement=${state.announcement.heading}, added=${added.product}, changed=${changed.product}, removed=${removed.product}`);
          NODE
