name: Dual Discord test

on:
  push:
    paths:
      - '.github/workflows/dual-discord-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send both Discord test messages
        env:
          KEYCAP_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEON_WEBHOOK: ${{ secrets.GEONWORKS_DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'NODE'
          const targets = [
            { name: 'KEYCAP', url: (process.env.KEYCAP_WEBHOOK || '').trim(), content: '🔔 **키캡 알림 테스트** — 푸시 알림 비교용 테스트입니다.' },
            { name: 'GEONWORKS', url: (process.env.GEON_WEBHOOK || '').trim(), content: '🔔 **지온웍스 알림 테스트** — 푸시 알림 비교용 테스트입니다.' }
          ];

          for (const target of targets) {
            if (!target.url) throw new Error(`${target.name} webhook is not configured`);
            const sendUrl = new URL(target.url);
            sendUrl.searchParams.set('wait', 'true');
            const response = await fetch(sendUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: target.name === 'KEYCAP' ? 'Guheyo Keycap Alert' : 'GEONWORKS Alert',
                content: target.content,
                allowed_mentions: { parse: [] }
              })
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`${target.name} failed: ${response.status} ${body}`);
            const message = body ? JSON.parse(body) : {};
            console.log(`${target.name}_STATUS`, response.status);
            console.log(`${target.name}_MESSAGE_ID`, message.id || 'none');
            console.log(`${target.name}_CHANNEL_ID`, message.channel_id || 'none');
          }
          NODE
