name: Temporary ProtoTypist notification display test

on:
  push:
    paths:
      - '.github/workflows/temp-prototypist-notification-test.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Send added, changed, and removed production embeds
        env:
          PROTOTYPIST_DISCORD_WEBHOOK_URL: ${{ secrets.PROTOTYPIST_DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'NODE'
          import {
            addedEmbed,
            changedEmbed,
            removedEmbed,
            postDiscord
          } from './scripts/check-prototypist-v3.mjs';

          const row = {
            sourceId: 'gmk',
            sourceLabel: 'GMK',
            sourceEmoji: '🇩🇪',
            sourceUrl: 'https://prototypist.notion.site/dfedac384a2b494c9137be7638b11e93',
            itemUrl: 'https://prototypist.notion.site/prototypist-notification-test',
            product: '[표시 검증] ProtoTypist 알림',
            status: 'In Manufacturing',
            expectedShipping: 'Q4 2026'
          };
          const detailNote = '생산 일정과 배송 예정 안내가 갱신되었습니다. (표시 검증용 상세 메모)';

          await postDiscord(addedEmbed(row, detailNote));
          await postDiscord(changedEmbed({
            row,
            detailNote,
            fields: [
              { label: '상태', before: 'In Group Buy', after: 'In Manufacturing' },
              { label: '예상 고객 배송', before: 'Q3 2026', after: 'Q4 2026' }
            ]
          }));
          await postDiscord(removedEmbed(row));
          console.log('Sent all three production embed variants.');
          NODE
