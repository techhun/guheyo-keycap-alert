name: Test Naver internal product API

on:
  push:
    paths:
      - '.github/workflows/test-naver-internal-api.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Test SmartStore page and internal JSON API
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          PAGE='https://smartstore.naver.com/seragio/products/294040523'
          API='https://smartstore.naver.com/i/v2/channels/2sWDvOMJt8KO2RJAoa750/products/294040523?withWindow=false'

          echo '=== PAGE ==='
          code=$(curl -sS -L -o /tmp/page.out -w '%{http_code}' --max-time 20 -A "$UA" "$PAGE" || true)
          echo "status=$code bytes=$(wc -c </tmp/page.out 2>/dev/null || echo 0)"

          echo '=== INTERNAL API ==='
          code=$(curl -sS -L -o /tmp/api.out -w '%{http_code}' --max-time 20 \
            -A "$UA" \
            -H 'Accept: application/json, text/plain, */*' \
            -H "Referer: $PAGE" \
            "$API" || true)
          echo "status=$code bytes=$(wc -c </tmp/api.out 2>/dev/null || echo 0)"
          echo 'body-prefix:'
          head -c 700 /tmp/api.out || true
          echo

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/test-naver-internal-api.yml
          git commit -m 'Remove Naver internal API test workflow'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
