name: Test latest DCInside alert

on:
  push:
    paths:
      - '.github/workflows/test-dcinside-latest.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Send latest DCInside post as real-format alert
        env:
          DCINSIDE_DISCORD_WEBHOOK_URL: ${{ secrets.DCINSIDE_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -z "$DCINSIDE_DISCORD_WEBHOOK_URL" ]; then
            echo 'DCINSIDE_DISCORD_WEBHOOK_URL is missing.'
            exit 1
          fi

          node <<'NODE'
          import { chromium } from 'playwright';

          const url = 'https://gall.dcinside.com/mgallery/board/lists/?id=mechanicalkeyboard&search_head=110&page=1';
          const browser = await chromium.launch({ headless: true, channel: 'chrome' });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 1600 },
            locale: 'ko-KR',
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          });

          try {
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            if (response && response.status() >= 400) throw new Error(`HTTP ${response.status()}`);
            await page.waitForTimeout(1200);

            const row = await page.evaluate(() => {
              const tidy = (value) => String(value ?? '').replace(/\s+/g, ' ').trim();
              const rows = [...document.querySelectorAll('tr.ub-content')];
              for (const tr of rows) {
                const category = tidy(tr.querySelector('.gall_subject')?.textContent);
                if (!/떴냐/.test(category)) continue;
                const anchor = tr.querySelector('.gall_tit a[href*="no="]');
                if (!anchor) continue;
                const href = new URL(anchor.href, location.href);
                const no = Number(href.searchParams.get('no'));
                if (!Number.isFinite(no) || no <= 0) continue;
                const title = tidy(anchor.textContent).replace(/^\[(?:⚡\s*)?떴냐\]\s*/i, '').replace(/^(?:⚡\s*)?떴냐\s*/i, '').trim();
                const authorEl = tr.querySelector('.gall_writer');
                const author = tidy(authorEl?.getAttribute('data-nick') || authorEl?.textContent);
                const dateEl = tr.querySelector('.gall_date');
                const date = tidy(dateEl?.getAttribute('title') || dateEl?.textContent);
                if (!title) continue;
                return {
                  no,
                  title,
                  author,
                  date,
                  url: `https://m.dcinside.com/board/mechanicalkeyboard/${no}`
                };
              }
              return null;
            });

            if (!row) throw new Error('Could not find the latest 떴냐 post.');
            console.log('Latest DCInside 떴냐 post:', JSON.stringify(row));

            const fields = [];
            if (row.author) fields.push({ name: '작성자', value: row.author, inline: true });
            if (row.date) fields.push({ name: '작성시간', value: row.date, inline: true });
            fields.push({ name: '글 번호', value: String(row.no), inline: true });

            const payload = {
              username: '기키갤 떴냐 알림',
              allowed_mentions: { parse: [] },
              embeds: [{
                title: `⚡ 기키갤 떴냐 · ${row.title}`.slice(0, 256),
                url: row.url,
                fields,
                footer: { text: 'DCInside · 기계식키보드 갤러리 · 떴냐' },
                timestamp: new Date().toISOString()
              }]
            };

            const webhookResponse = await fetch(process.env.DCINSIDE_DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!webhookResponse.ok) {
              throw new Error(`Discord webhook failed: ${webhookResponse.status} ${await webhookResponse.text()}`);
            }
            console.log('Latest DCInside real-format test notification sent successfully.');
          } finally {
            await browser.close();
          }
          NODE
