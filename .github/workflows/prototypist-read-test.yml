name: Prototypist Notion read test

on:
  push:
    paths:
      - '.github/workflows/prototypist-read-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read Prototypist Notion pages
        run: node tests/prototypist-read.mjs
