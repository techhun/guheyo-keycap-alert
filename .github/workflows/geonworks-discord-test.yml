name: GEONWORKS Discord test

on:
  push:
    paths:
      - '.github/workflows/geonworks-discord-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send GEONWORKS test alert
        env:
          GEONWORKS_DISCORD_WEBHOOK_URL: ${{ secrets.GEONWORKS_DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const webhook = (process.env.GEONWORKS_DISCORD_WEBHOOK_URL || '').trim();
          if (!webhook) throw new Error('GEONWORKS_DISCORD_WEBHOOK_URL is not configured');

          const state = JSON.parse(fs.readFileSync('geonworks-state.json', 'utf8'));
          const rows = Object.values(state.rows || state.items || state.data || {});
          const item = rows.find(x => x && (x.product === 'TYPFACE KAFKA Barebones Kit' || x.name === 'TYPFACE KAFKA Barebones Kit')) || rows[0];
          if (!item) throw new Error('No GEONWORKS baseline row found');

          const product = item.product || item.name || 'GEONWORKS GB';
          const eta = item.eta || item.expectedShip || item['예상 발송일'] || '';
          const type = item.type || item.category || '';
          const manufacturer = item.manufacturer || '';
          const status = item.status || '';
          const update = item.update || item.updated || item.updateDate || '';
          const note = item.note || item.notes || '';
          const gbStart = item.gbStart || item.start || item.gb_start || '';

          const fields = [
            ['상태', status],
            ['예상 발송일', eta],
            ['GB 시작일', gbStart],
            ['분류', type],
            ['제조사', manufacturer],
            ['갱신 일자', update]
          ].filter(([, value]) => String(value || '').trim()).map(([name, value]) => ({ name, value: String(value), inline: true }));

          const description = String(note || '현재 저장된 지온웍스 GB 데이터로 전송한 연결 테스트입니다.');
          const url = 'https://geonworks.kr/customhtml/GB_schedule.html';

          const response = await fetch(webhook, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: 'GEONWORKS Alert',
              allowed_mentions: { parse: [] },
              embeds: [{
                title: `🧪 GEONWORKS 연결 테스트 · ${product}`,
                url,
                description: `${description}\n\n[🔗 GB Schedule 보기](${url})`,
                fields,
                footer: { text: 'GEONWORKS · GB Schedule 알림 · 테스트' },
                timestamp: new Date().toISOString()
              }]
            })
          });

          if (!response.ok) throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
          console.log('GEONWORKS Discord test sent:', product);
          NODE
