name: Discord format test

on:
  push:
    paths:
      - '.github/workflows/discord-format-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Send latest listing with new Discord format
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const webhook = (process.env.DISCORD_WEBHOOK_URL || '').trim();
          if (!webhook) throw new Error('DISCORD_WEBHOOK_URL is not configured');

          const formatPriceManwon = (price) => {
            const amount = Number(String(price || '').replace(/[^\d]/g, ''));
            if (!Number.isFinite(amount) || amount <= 0) return '';
            return new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 2 }).format(amount / 10000);
          };

          const browser = await chromium.launch({ headless: true, channel: 'chrome' });
          try {
            const page = await browser.newPage({ locale: 'ko-KR' });
            await page.goto('https://guheyo.com/g/keyboard/sell?category=keycap', { waitUntil: 'domcontentloaded', timeout: 60000 });
            const links = page.locator('a[href*="/offer/"]');
            await links.first().waitFor({ state: 'attached', timeout: 20000 });
            await page.waitForTimeout(1500);

            const rows = await links.evaluateAll(nodes => nodes.map(a => ({
              href: a.href,
              text: (a.innerText || a.textContent || '').replace(/\s+/g, ' ').trim()
            })));
            const latest = rows.find(x => /키캡/.test(x.text) && /[\d,]+\s*원/.test(x.text));
            if (!latest) throw new Error('No keycap listing found');

            const normalized = latest.text.replace(/\s+/g, ' ').trim();
            const price = normalized.match(/([\d,]+\s*원)\s*$/)?.[1] || '';
            const title = normalized
              .replace(/^(?:방금 전|하루 전|한 시간 전|\d+\s*(?:초|분|시간|일)\s*전)\s+/, '')
              .replace(/\s+키캡\s+[\d,]+\s*원\s*$/, '')
              .trim();

            const detailPage = await browser.newPage({ locale: 'ko-KR' });
            const contents = [];
            detailPage.on('response', async response => {
              try {
                if (!response.url().includes('api.guheyo.com/graphql')) return;
                const json = await response.json();
                const content = json?.data?.findOffer?.content;
                if (typeof content === 'string' && content.trim()) contents.push(content.trim());
              } catch {}
            });

            await detailPage.goto(latest.href, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await detailPage.waitForLoadState('networkidle', { timeout: 5000 }).catch(() => {});
            await detailPage.waitForTimeout(700);
            const detail = contents.sort((a, b) => b.length - a.length)[0] || '';
            if (!detail) throw new Error('Full offer content was not captured from GraphQL');

            const shortPrice = formatPriceManwon(price);
            const titleText = shortPrice ? `${title} - ${shortPrice}` : title;

            console.log('LATEST', latest.href);
            console.log('TITLE', titleText);
            console.log('DETAIL_LENGTH', detail.length);

            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: 'Guheyo Keycap Alert',
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: `🆕 ${titleText}`,
                  url: latest.href,
                  description: `${detail}\n\n[🔗 판매글 보기](${latest.href})`,
                  footer: { text: '구해요 · 키캡 판매 알림' },
                  timestamp: new Date().toISOString()
                }]
              })
            });
            if (!response.ok) throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
          } finally {
            await browser.close();
          }
          NODE
