name: ProtoTypist pattern test

on:
  push:
    paths:
      - '.github/workflows/prototypist-pattern-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send ProtoTypist pattern samples
        env:
          WEBHOOK: ${{ secrets.PROTOTYPIST_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          node <<'NODE'
          const webhook = (process.env.WEBHOOK || '').trim();
          if (!webhook) throw new Error('PROTOTYPIST_DISCORD_WEBHOOK_URL is empty');

          const send = async (embed) => {
            const res = await fetch(webhook + (webhook.includes('?') ? '&wait=true' : '?wait=true'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: 'Proto[Typist] Updates',
                allowed_mentions: { parse: [] },
                embeds: [embed]
              })
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`Discord webhook failed: ${res.status} ${text}`);
          };

          const now = () => new Date().toISOString();

          await send({
            title: '🆕 ⌨️ Keyboard 추가 · [TEST] Supernova 60%',
            url: 'https://prototypist.notion.site/Supernova-60-3d10423341548037bc96d6dde6f28fae',
            fields: [
              { name: '상태', value: 'In Group Buy', inline: true },
              { name: '예상 고객 배송', value: 'Q1 2027', inline: true }
            ],
            footer: { text: 'Proto[Typist] · Keyboard Updates' },
            timestamp: now()
          });

          await send({
            title: '🔄 🇩🇪 GMK 업데이트 · [TEST] GMK CYL Zooted R2',
            url: 'https://prototypist.notion.site/dfedac384a2b494c9137be7638b11e93?v=11769ac8c9764aafb907fe3d65fb0c50',
            fields: [
              { name: '상태', value: '이전: Shipping to Prototypist\n현재: Shipping to Customers', inline: false },
              { name: '예상 고객 배송', value: '이전: Q3 2026\n현재: Q4 2026', inline: false }
            ],
            footer: { text: 'Proto[Typist] · GMK Updates' },
            timestamp: now()
          });

          await send({
            title: '➖ 🧢 Keyset 목록에서 제거 · [TEST] SWG Lavender',
            url: 'https://prototypist.notion.site/119c46c4a89140e98b295ed0102eb94e?v=a13cd09931964dd596b125ea0013f5c6',
            description: 'Proto[Typist]의 현재 업데이트 보드에서 사라졌습니다.',
            fields: [
              { name: '마지막 상태', value: 'In Manufacturing', inline: true },
              { name: '예상 고객 배송', value: 'Q1 2027', inline: true }
            ],
            footer: { text: 'Proto[Typist] · Keyset Updates' },
            timestamp: now()
          });

          console.log('Sent 3 ProtoTypist pattern test messages successfully.');
          NODE
