name: Discord detail diagnose

on:
  push:
    paths:
      - '.github/workflows/discord-diagnose.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Inspect latest listing detail sources
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, channel: 'chrome' });
          try {
            const page = await browser.newPage({ locale: 'ko-KR' });
            await page.goto('https://guheyo.com/g/keyboard/sell?category=keycap', { waitUntil: 'domcontentloaded', timeout: 60000 });
            const links = page.locator('a[href*="/offer/"]');
            await links.first().waitFor({ state: 'attached', timeout: 20000 });
            await page.waitForTimeout(1500);
            const rows = await links.evaluateAll(nodes => nodes.map(a => ({ href:a.href, text:(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim() })));
            const latest = rows.find(x => /키캡/.test(x.text) && /[\d,]+\s*원/.test(x.text));
            if (!latest) throw new Error('No keycap listing found');
            const d = await browser.newPage({ locale: 'ko-KR' });
            await d.goto(latest.href, { waitUntil:'domcontentloaded', timeout:60000 });
            await d.waitForTimeout(1500);
            const result = await d.evaluate(() => {
              let jsonld = '';
              for (const script of document.querySelectorAll('script[type="application/ld+json"]')) {
                try {
                  const parsed = JSON.parse(script.textContent || 'null');
                  for (const node of (Array.isArray(parsed)?parsed:[parsed])) {
                    if (node && node['@type']==='Product' && typeof node.description==='string') jsonld = node.description;
                  }
                } catch {}
              }
              const meta = document.querySelector('meta[property="og:description"], meta[name="description"]')?.getAttribute('content') || '';
              const body = document.body?.innerText || '';
              return {jsonld, meta, body};
            });
            console.log('LATEST', latest);
            console.log('JSONLD', JSON.stringify(result.jsonld));
            console.log('META', JSON.stringify(result.meta));
            console.log('BODY', JSON.stringify(result.body));
          } finally { await browser.close(); }
          NODE
