name: Fix SWAGKEYS ETA normalization

on:
  push:
    paths:
      - '.github/workflows/fix-swagkeys-eta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize SWAGKEYS ETA comparisons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-swagkeys.mjs')
          text = path.read_text()

          marker = "const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));\n"
          helper = r'''

const ENGLISH_MONTHS = new Map([
  ['january', 1], ['february', 2], ['march', 3], ['april', 4], ['may', 5], ['june', 6],
  ['july', 7], ['august', 8], ['september', 9], ['october', 10], ['november', 11], ['december', 12]
]);

function canonicalDate(year, month, day) {
  const y = Number(year);
  const m = Number(month);
  const d = Number(day);
  if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)
      || y < 2000 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return '';
  return `${String(y).padStart(4, '0')}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function normalizeEta(value) {
  const text = clean(value);
  if (!text) return '';

  let match = text.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일$/);
  if (match) return canonicalDate(match[1], match[2], match[3]) || text;

  match = text.match(/^(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})\.?$/);
  if (match) return canonicalDate(match[1], match[2], match[3]) || text;

  match = text.match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})$/);
  if (match) {
    const month = ENGLISH_MONTHS.get(match[1].toLowerCase());
    if (month) return canonicalDate(match[3], month, match[2]) || text;
  }

  return text;
}

function comparableFieldValue(fieldKey, value) {
  return fieldKey === 'eta' ? normalizeEta(value) : clean(value);
}
'''

          if 'function normalizeEta(value)' not in text:
              if marker not in text:
                  raise SystemExit('helper insertion marker not found')
              text = text.replace(marker, marker + helper, 1)

          old = """    const changedFields = fields
      .filter((field) => clean(before[field.key]) !== clean(row[field.key]))
      .map((field) => ({ ...field, before: before[field.key], after: row[field.key] }));
"""
          new = """    const changedFields = fields
      .filter((field) => comparableFieldValue(field.key, before[field.key]) !== comparableFieldValue(field.key, row[field.key]))
      .map((field) => ({
        ...field,
        before: field.key === 'eta' ? normalizeEta(before[field.key]) : before[field.key],
        after: field.key === 'eta' ? normalizeEta(row[field.key]) : row[field.key]
      }));
"""
          if old not in text:
              raise SystemExit('diffRows comparison block not found')
          text = text.replace(old, new, 1)

          old_save = "    rows: snapshot.rows\n"
          new_save = "    rows: snapshot.rows.map((row) => ({ ...row, eta: normalizeEta(row.eta) }))\n"
          if old_save not in text:
              raise SystemExit('saveState rows block not found')
          text = text.replace(old_save, new_save, 1)

          path.write_text(text)
          PY

          node --check scripts/check-swagkeys.mjs

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-swagkeys-eta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-swagkeys.mjs .github/workflows/fix-swagkeys-eta.yml
          git commit -m 'Normalize SWAGKEYS ETA dates'
          git pull --rebase origin main
          git push origin main
