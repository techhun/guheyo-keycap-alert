name: Fix SWAGKEYS ETA normalization

on:
  push:
    paths:
      - '.github/workflows/fix-swagkeys-eta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate SWAGKEYS watcher
        shell: bash
        run: |
          echo '' | base64 -d | python3
          node --check scripts/check-swagkeys.mjs

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-swagkeys-eta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-swagkeys.mjs .github/workflows/fix-swagkeys-eta.yml
          git commit -m 'Normalize SWAGKEYS ETA dates'
          git pull --rebase origin main
          git push origin main
