name: Setup restock Discord bot

on:
  push:
    paths:
      - '.github/workflows/setup-restock-bot.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Discord dependency and scripts
        shell: bash
        run: |
          npm install discord.js@14 --save-exact --no-audit --no-fund
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['restock:bot'] = 'node scripts/restock-bot.mjs';
          pkg.scripts['restock:register'] = 'node scripts/register-restock-commands.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS
          npm install --package-lock-only --no-audit --no-fund

      - name: Validate restock code
        shell: bash
        run: |
          node --check scripts/restock-bot.mjs
          node --check scripts/register-restock-commands.mjs
          node --check scripts/check-restock.mjs
          node --check scripts/restock/engine.mjs
          node --check scripts/restock/storage.mjs
          node --check scripts/restock/providers/common.mjs
          node --check scripts/restock/providers/index.mjs
          node --check scripts/restock/providers/shopify.mjs
          node --check scripts/restock/providers/naver-smartstore.mjs
          npm run check:restock
          git diff --check

      - name: Commit setup and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git rm .github/workflows/setup-restock-bot.yml
          git commit -m 'Add Discord restock bot dependencies'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
